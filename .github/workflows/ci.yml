name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # This Gitea runner has no Actions cache service.
          cache: false
      - name: Formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Files needing gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
